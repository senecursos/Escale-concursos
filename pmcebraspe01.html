        id: 120,
        materia: "Noções de Direitos Humanos",
        textoApoio: "A respeito da história dos direitos humanos e do Pacto de São José, julgue os itens a seguir.",
        enunciado: "120. Todos os direitos humanos foram afirmados em um único momento histórico.",
        tipo: "ME",
        opcoes: ["A) Certo", "B) Errado"],
        gabarito: 1
      }

    ];

    /* ===================================================================
       2. LÓGICA DE FUNCIONAMENTO DO SIMULADO
       =================================================================== */
    let respostasUsuario = {};
    let segundosDecorridos = 0;
    
    /* CRONÔMETRO AUTOMÁTICO (MM:SS OU HH:MM:SS) */
    let cronometro = setInterval(() => {
      segundosDecorridos++;
      
      const horas = Math.floor(segundosDecorridos / 3600);
      const min = Math.floor((segundosDecorridos % 3600) / 60);
      const seg = segundosDecorridos % 60;

      const minStr = String(min).padStart(2, '0');
      const segStr = String(seg).padStart(2, '0');

      if (horas > 0) {
        const horasStr = String(horas).padStart(2, '0');
        document.getElementById('timer-display').innerText = `Tempo: ${horasStr}:${minStr}:${segStr}`;
      } else {
        document.getElementById('timer-display').innerText = `Tempo: ${minStr}:${segStr}`;
      }
    }, 1000);

    function carregarSimulado() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      bancoQuestoes.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'simulado-card';
        
        const materiaHTML = q.materia ? `<span class="q-materia">${q.materia}</span>` : '';
        let textoApoioHTML = q.textoApoio ? `
          <div class="support-text-box">
            <span class="support-text-title">📖 Texto de Apoio / Contexto</span>
            ${q.textoApoio}
          </div>
        ` : '';

        let opcoesHTML = '';
        q.opcoes.forEach((opt, optIndex) => {
          opcoesHTML += `
            <button class="opt-btn" id="q${q.id}-opt${optIndex}" onclick="selecionarResposta(${q.id}, ${optIndex})">
              ${opt}
            </button>
          `;
        });

        card.innerHTML = `
          <div class="q-header">
            <span class="q-number">Questão ${index + 1}</span>
            ${materiaHTML}
          </div>
          ${textoApoioHTML}
          <p class="q-text">${q.enunciado}</p>
          <div class="options-grid">${opcoesHTML}</div>
        `;
        container.appendChild(card);
      });
    }

    function selecionarResposta(questaoId, opcaoIndex) {
      respostasUsuario[questaoId] = opcaoIndex;
      const qData = bancoQuestoes.find(q => q.id === questaoId);
      
      qData.opcoes.forEach((_, idx) => {
        const btn = document.getElementById(`q${questaoId}-opt${idx}`);
        if (btn) btn.classList.remove('selected');
      });

      const btnSelecionado = document.getElementById(`q${questaoId}-opt${opcaoIndex}`);
      if (btnSelecionado) btnSelecionado.classList.add('selected');
    }

    function finalizarSimulado() {
      if (Object.keys(respostasUsuario).length < bancoQuestoes.length) {
        if (!confirm("Você possui questões não respondidas. Deseja finalizar mesmo assim?")) {
          return;
        }
      }

      clearInterval(cronometro);

      let totalAcertos = 0;
      const reviewContainer = document.getElementById('review-list');
      reviewContainer.innerHTML = '';

      bancoQuestoes.forEach((q, index) => {
        const respUsuario = respostasUsuario[q.id];
        const acertou = respUsuario === q.gabarito;
        if (acertou) totalAcertos++;

        const reviewItem = document.createElement('div');
        reviewItem.className = 'review-item';
        
        const textoRespostaUsuario = respUsuario !== undefined ? q.opcoes[respUsuario] : 'Não respondida';
        const textoGabarito = q.opcoes[q.gabarito];

        reviewItem.innerHTML = `
          <strong>Q${index + 1}:</strong> ${acertou ? '<span class="review-correct">✓ ACERTOU</span>' : '<span class="review-incorrect">✕ ERROU</span>'}<br>
          <small>Sua resposta: ${textoRespostaUsuario} | <strong>Gabarito: ${textoGabarito}</strong></small>
        `;
        reviewContainer.appendChild(reviewItem);
      });

      const porcentagem = Math.round((totalAcertos / bancoQuestoes.length) * 100);

      document.getElementById('quiz-container').style.display = 'none';
      document.getElementById('btn-submit').style.display = 'none';
      
      document.getElementById('score-percentage').innerText = `${porcentagem}%`;
      document.getElementById('score-summary').innerText = `Você acertou ${totalAcertos} de ${bancoQuestoes.length} questões.`;
      document.getElementById('result-screen').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function compartilharSimulado() {
      if (navigator.share) {
        navigator.share({
          title: 'Simulado PM | Escale Concursos',
          text: 'Faça este simulado gratuito no padrão Cebraspe e teste seus conhecimentos!',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link do simulado copiado para a área de transferência!');
      }
    }

    function irParaVendas() {
      const btnVendas = document.getElementById('btn-buy-pdf');
      if (btnVendas) {
        btnVendas.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    carregarSimulado();
  </script>
</body>
</html>
